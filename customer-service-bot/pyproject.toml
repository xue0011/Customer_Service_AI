[project]
name = "customer-service-bot"
version = "0.3.0"
description = "Enterprise Multi-Agent Customer Service System for multi-platform e-commerce stores"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "jinja2>=3.0",
    "httpx>=0.25",
    "redis>=5.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    # Web 层
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    # 数据层：PostgreSQL + SQLAlchemy + Alembic（SQLite/aiosqlite 用于测试）
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "aiosqlite>=0.20",
    # 认证授权
    "pyjwt[crypto]>=2.8",
    "bcrypt>=4.0",
    # 异步任务队列（Worker）
    "arq>=0.26",
    # 可观测：Prometheus 指标
    "prometheus-fastapi-instrumentator>=7.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "fakeredis>=2.20",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "UP042"]  # E501 行长；B008 FastAPI Depends 标准模式；UP042 保留 str,Enum 兼容

[tool.ruff.lint.per-file-ignores]
"src/web_server.py" = ["F401"]  # legacy try-import 探测
"src/core/bus.py" = ["E731"]    # legacy lambda
"src/database/seed.py" = ["F841"]  # legacy MySQL seed 脚本

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
